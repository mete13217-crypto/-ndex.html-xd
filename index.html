<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sohbet & WhatsApp</title>
    <style>
        /* Modern Karanlık Tema */
        body { font-family: 'Segoe UI', sans-serif; background-color: #121212; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #chat-container { width: 100%; max-width: 450px; height: 100vh; background-color: #1e1e1e; display: flex; flex-direction: column; }
        
        /* WhatsApp Butonu */
        #wa-header { 
            background-color: #25D366; 
            color: white; 
            padding: 15px; 
            text-align: center; 
            text-decoration: none; 
            font-weight: bold;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        #messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 12px; border-radius: 12px; color: #fff; max-width: 80%; font-size: 0.9rem; }
        .message.self { background-color: #0b93f6; align-self: flex-end; }

        #input-area { padding: 15px; background-color: #2a2a2a; display: flex; gap: 10px; }
        #msg-input { flex: 1; padding: 12px; border-radius: 20px; border: none; background: #444; color: white; outline: none; }
        
        button { background-color: #25D366; border: none; color: white; padding: 10px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="chat-container">
    <a href="https://chat.whatsapp.com/KATILIM_LINKI_BURAYA" target="_blank" id="wa-header">
        🟢 WHATSAPP GRUBUNA KATILMAK İÇİN TIKLA
    </a>

    <div id="messages">
        <div class="message self">Mesajınızı yazıp gönderin, WhatsApp grubuna iletelim!</div>
    </div>

    <div id="input-area">
        <input type="text" id="msg-input" placeholder="Mesajınızı buraya yazın...">
        <button onclick="sendToWhatsApp()">İLET</button>
    </div>
</div>

<script>
    function sendToWhatsApp() {
        const input = document.getElementById('msg-input');
        const text = input.value.trim();

        if (text !== "") {
            // 2. ADIM: BURAYA GRUP LİNKİNİ VEYA TELEFON NUMARANI YAZABİLİRSİN
            // Eğer doğrudan bir numaraya gitsin istiyorsan: https://wa.me/905xxxxxxxxx?text=...
            const waUrl = "https://wa.me/?text=" + encodeURIComponent(text);
            
            // Kullanıcıyı mesajı hazır şekilde WhatsApp'a yönlendirir
            window.open(waUrl, '_blank');
            
            // Ekranda da görünüp kaybolması için (isteğe bağlı)
            const msgDiv = document.createElement('div');
            msgDiv.className = "message self";
            msgDiv.textContent = text;
            document.getElementById('messages').appendChild(msgDiv);
            input.value = "";
        }
    }

    // Enter tuşu desteği
    document.getElementById('msg-input').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') sendToWhatsApp();
    });
</script>

</body>
</html>
